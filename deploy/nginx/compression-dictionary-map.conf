# Compression Dictionary Transport (RFC 9842) — http{} context.
#
# A dcz variant is only served when the client both offers the `dcz` encoding and reports
# which dictionary it holds. `Dictionary-ID` carries the dictionary's 8-character build
# hash, which is the only filename-safe key available (`Available-Dictionary` is base64).
# The character class also keeps the client-controlled value out of path traversal.
map "$http_accept_encoding:$http_dictionary_id" $dcz_id {
    default                                      "";
    "~*\bdcz\b.*:\"?(?<id>[A-Za-z0-9_-]{8})\"?$" $id;
}
